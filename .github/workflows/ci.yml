name: ci

# Valores de teste: as passwords abaixo são descartáveis e só existem dentro deste job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: queryshield
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d queryshield"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      QS_ADMIN_DSN: postgresql://postgres:ci-only-admin@localhost:5432/queryshield
      QS_READER_PASSWORD: ci-only-reader
      QS_READER_DSN: postgresql://qs_reader:ci-only-reader@localhost:5432/queryshield
      QS_JWT_SECRET: ci-only-jwt-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências fixadas
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint e formatação)
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Migrações e seed no serviço PostgreSQL
        run: |
          python -m db.migrate
          python -m db.seed
      - name: Testes unitários
        run: python -m pytest -m "not postgres" -q
      - name: Testes PostgreSQL (pgserver real)
        run: python -m pytest -m postgres -q
      - name: Golden e avaliação mock (no serviço PostgreSQL)
        run: |
          python -m eval.build_questions
          python -m eval.build_expected
          python -m eval.run_eval
      - name: Publicar relatório de avaliação
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-mock
          path: eval/reports/report-mock.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Bundle sem ligações ou segredos
        run: |
          if grep -rIlE "postgresql://|qs_reader|QS_ADMIN|QS_READER|QS_JWT" dist; then
            echo "segredo ou ligação encontrada no bundle"; exit 1
          fi
