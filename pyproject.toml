[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "queryshield"
version = "0.1.0"
description = "Pergunta aos teus dados em linguagem natural, com validação AST e protecções na base de dados."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "sqlglot==30.33.0",
    "psycopg[binary]==3.3.9",
    "psycopg-pool==3.3.3",
    "httpx==0.28.1",
    "pyjwt==2.15.1",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "pgserver==0.1.4",
    "psutil==7.2.2",
]

[tool.setuptools]
[tool.setuptools.packages.find]
include = ["backend*", "db*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "postgres: testes que exigem PostgreSQL real (pgserver).",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend/node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
