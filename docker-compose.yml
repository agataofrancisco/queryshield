# NÃO TESTADO LOCALMENTE: este ambiente não tem Docker. Validado apenas como YAML (tarefa 8.1).
# Uso: definir as variáveis obrigatórias num ficheiro .env LOCAL (nunca commitado), depois
#   docker compose up --build
# Variáveis obrigatórias: POSTGRES_PASSWORD, QS_READER_PASSWORD, QS_JWT_SECRET.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queryshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d queryshield"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["sh", "-c", "python -m db.migrate && python -m db.seed"]
    environment:
      QS_ADMIN_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?}@db:5432/queryshield
      QS_READER_PASSWORD: ${QS_READER_PASSWORD:?defina QS_READER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      QS_READER_DSN: postgresql://qs_reader:${QS_READER_PASSWORD:?}@db:5432/queryshield
      QS_JWT_SECRET: ${QS_JWT_SECRET:?defina QS_JWT_SECRET}
      QS_DEMO_AUTH: "false"
      QS_LLM_PROVIDER: mock
      QS_CORS_ORIGINS: http://localhost:13200
    ports:
      - "18200:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:18200
    ports:
      - "13200:80"
    depends_on:
      - api

volumes:
  pgdata:
